
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Interactive Image Gallery</h1>
        <p>Explore beautiful photographs</p>
    </header>

    <main>
        <section class="gallery" id="gallery">

            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80"
                 alt="Mountain landscape">

            <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=600&q=80"
                 alt="Ocean waves">

            <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80"
                 alt="Green forest">

            <img src="https://images.unsplash.com/photo-1509316785289-025f5b846b35?auto=format&fit=crop&w=600&q=80"
                 alt="Desert landscape">

            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80"
                 alt="Mountain lake">

            <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=600&q=80"
                 alt="Colorful flowers">

            <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=600&q=80"
                 alt="City skyline">

            <img src="https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?auto=format&fit=crop&w=600&q=80"
                 alt="Starry night sky">

        </section>
    </main>

    
<!-- Lightbox -->
<div class="lightbox" id="lightbox">

    <button class="close" id="close" aria-label="Close image">
        &times;
    </button>

    <button class="prev" id="prev" aria-label="Previous image">
        &#10094;
    </button>

    <img src="" alt="Enlarged photograph" id="lightbox-img">

    <button class="next" id="next" aria-label="Next image">
        &#10095;
    </button>

</div>



    <script src="script.js"></script>

</body>
</html>
