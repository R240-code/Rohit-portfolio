<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Amazon | Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<!-- Navigation Bar -->
<header class="navbar">
    <div class="logo">
        Mini<span>Amazon</span>
    </div>

    <div class="search-container">
        <input
            type="text"
            id="search-input"
            placeholder="Search products..."
            aria-label="Search products"
        >
        <button id="search-btn" type="button">Search</button>
    </div>

    <a href="cart.html" class="cart-link">
        🛒 Cart <span id="cart-count">0</span>
    </a>
</header>

<!-- Main Content -->
<main class="container">

    <section class="welcome-section">
        <h1>Welcome to Mini Amazon</h1>
        <p>Discover amazing products at great prices!</p>
    </section>

    <!-- Category Filter -->
    <section class="filter-section">
        <label for="category-filter">Choose a category:</label>

        <select id="category-filter">
            <option value="all">All Products</option>
            <option value="Electronics">Electronics</option>
            <option value="Fashion">Fashion</option>
            <option value="Accessories">Accessories</option>
        </select>
    </section>

    <!-- Products Grid -->
    <section>
        <h2 class="section-title">Our Products</h2>

        <div id="product-grid" class="product-grid">
            <!-- JavaScript will display product cards here -->
        </div>

        <p id="no-products" hidden>
            No products found. Try another search.
        </p>
    </section>

</main>

<!-- Product Details Popup -->
<div id="product-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true"
         aria-labelledby="modal-title">

        <button id="close-modal" class="close-btn"
                type="button" aria-label="Close product details">
            &times;
        </button>

        <img id="modal-image" src="" alt="Product image">

        <h2 id="modal-title"></h2>

        <p id="modal-category"></p>

        <p id="modal-description"></p>

        <h3 id="modal-price"></h3>

        <button id="modal-add-to-cart" type="button">
            Add to Cart
        </button>
    </div>
</div>

<script src="script.js"></script>


</body>
</html>
